name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flake:
    name: nix flake check + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Evaluates every flake output. This is the check that catches a broken
      # flake.nix (a typo in an output, a bad reference) before a consumer
      # does -- `nix build` alone only looks at the one attribute asked for.
      - name: flake evaluates
        run: nix flake check --no-build

      # The `ci` output in flake.nix does compileall + the unit tests. It is
      # deliberately hermetic: no network, no tmux server, no remote host, so
      # it passes on a runner that cannot reach the tailnet.
      - name: unit tests (hermetic)
        run: nix build .#ci --print-build-logs

      - name: build the package
        run: nix build .#dashboard --print-build-logs
